name: Deploy dashboard

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Marca la versión en los archivos: la app compara con version.json y se
      # recarga sola cuando hay una nueva (sin reinstalarla en el iPhone).
      - name: Stamp build version
        run: |
          BUILD="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          sed -i "s/__BUILD__/${BUILD}/g" web/index.html web/app.js web/firebase-messaging-sw.js
          echo "{\"version\": \"${BUILD}\"}" > web/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
