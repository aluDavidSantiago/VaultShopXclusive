name: Monitor

# Cada 20 minutos, en minutos poco concurridos (:07, :27, :47): GitHub retrasa o
# descarta ejecuciones en las horas en punto. También a mano desde la pestaña Actions.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Qué ejecutar"
        type: choice
        default: monitor
        options: [monitor, notificacion-de-prueba, recomendacion-de-prueba]
  schedule:
    - cron: "7,27,47 * * * *"

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # para el paso que mantiene vivo el cron

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - if: inputs.mode == 'recomendacion-de-prueba'
        run: python -m monitor.notify --recommend
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
      - if: inputs.mode != 'notificacion-de-prueba' && inputs.mode != 'recomendacion-de-prueba'
        run: python -m monitor.main
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
      - if: inputs.mode == 'notificacion-de-prueba'
        run: python -m monitor.notify --test
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
      # GitHub pausa los cron tras 60 días sin actividad en el repo. Una vez al día
      # se vuelve a activar el workflow por la API (sin commits) para que nunca se pare.
      - if: github.event_name == 'schedule' && github.event.schedule == '7,27,47 * * * *'
        run: |
          if [ "$(date -u +%H%M)" -lt "0030" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monitor.yml/enable" && echo "cron mantenido activo"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
