name: Monitor

# Cada 20 minutos (GitHub puede retrasar las ejecuciones programadas unos minutos)
# y también a mano desde la pestaña Actions.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Qué ejecutar"
        type: choice
        default: monitor
        options: [monitor, notificacion-de-prueba, recomendacion-de-prueba]
  schedule:
    - cron: "*/20 * * * *"

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - if: inputs.mode == 'recomendacion-de-prueba'
        run: python -m monitor.notify --recommend
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
      - if: inputs.mode != 'notificacion-de-prueba' && inputs.mode != 'recomendacion-de-prueba'
        run: python -m monitor.main
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
      - if: inputs.mode == 'notificacion-de-prueba'
        run: python -m monitor.notify --test
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
